# Alembic configuration. Migration scripts live in backend/alembic.
# The database URL is intentionally NOT stored here; backend/alembic/env.py
# resolves it at runtime from app.core.config.get_settings() (project .env),
# or from the caller-provided engine URL (see app.lifecycle bootstrap), or
# from the command line flag: alembic -x database_url=...
# NOTE: keep this file ASCII-only; alembic reads it with the locale encoding.

[alembic]
script_location = %(here)s/backend/alembic
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
