services:
  minio:
    image: minio/minio:latest
    container_name: pictureshow-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pictureshow
      MINIO_ROOT_PASSWORD: pictureshow-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - E:\dockerVolums\picture-show\minio:/data
    restart: unless-stopped

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: pictureshow-milvus-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - --advertise-client-urls=http://127.0.0.1:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - E:\dockerVolums\picture-show\Milvus\etcd:/etcd
    restart: unless-stopped

  milvus-minio:
    image: minio/minio:latest
    container_name: pictureshow-milvus-minio
    command: server /minio_data
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - E:\dockerVolums\picture-show\Milvus\minio:/minio_data
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.5.6
    container_name: pictureshow-milvus
    command:
      - milvus
      - run
      - standalone
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - E:\dockerVolums\picture-show\Milvus\standalone:/var/lib/milvus
    depends_on:
      - milvus-etcd
      - milvus-minio
    restart: unless-stopped
